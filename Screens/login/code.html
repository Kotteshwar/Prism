<!DOCTYPE html><html class="dark" lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@500;600;700&amp;family=Google+Sans:wght@400;500;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "tertiary-fixed": "#f1dfd4", "surface-container-high": "#2a2a2a", "surface-container": "#1f2020", "secondary-fixed": "#e2e2e4", "outline": "#8e9194", "on-surface-variant": "#c4c7ca", "secondary-fixed-dim": "#c6c6c8", "background": "#131314", "surface-container-low": "#1b1c1c", "on-error": "#690005", "error": "#ffb4ab", "primary-fixed-dim": "#c1c7cc", "surface-bright": "#393939", "surface-tint": "#c1c7cc", "on-primary": "#2b3135", "primary-container": "#c9ced3", "primary-fixed": "#dee3e8", "error-container": "#93000a", "on-primary-fixed": "#161c20", "surface-dim": "#131314", "surface": "#131314", "on-secondary-container": "#b5b5b7", "surface-variant": "#353535", "on-surface": "#e4e2e2", "secondary-container": "#454749", "on-error-container": "#ffdad6", "on-primary-container": "#52585c", "tertiary-fixed-dim": "#d4c3b8", "on-tertiary-fixed": "#231a13", "on-primary-fixed-variant": "#42484b", "inverse-surface": "#e4e2e2", "inverse-primary": "#595f63", "surface-container-lowest": "#0e0e0e", "on-secondary": "#2f3132", "on-tertiary": "#392e27", "surface-container-highest": "#353535", "outline-variant": "#44474a", "on-tertiary-container": "#61544c", "tertiary": "#f8e6db", "on-background": "#e4e2e2", "on-secondary-fixed-variant": "#454749", "tertiary-container": "#dbcabf", "inverse-on-surface": "#303030", "on-tertiary-fixed-variant": "#50453c", "primary": "#e5eaef", "on-secondary-fixed": "#1a1c1d", "secondary": "#c6c6c8" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: {}, fontFamily: { "headline": ["Epilogue"], "display": ["Epilogue"], "body": ["Inter"], "label": ["Google Sans"] }, fontSize: {} } } }</script><style>@layer base { html, body { margin: 0; padding: 0; min-height: 100%; } .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } main > :first-child { margin-top: 0 !important; } main > :last-child { margin-bottom: 0 !important; } } ::-webkit-scrollbar { display: none; }</style><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface text-on-surface font-body min-h-screen flex flex-col selection:bg-surface-tint selection:text-on-primary"><main class="flex-1 flex flex-col relative w-full bg-surface pt-safe pb-safe"><div class="flex flex-col w-full min-w-0 px-6 py-8 relative overflow-hidden">
<!-- Subtle Ambient Glow Layer behind Vault Lock -->
<div class="absolute -top-24 left-1/2 -translate-x-1/2 w-80 h-80 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute top-1/3 -right-20 w-60 h-60 bg-tertiary/5 rounded-full blur-3xl pointer-events-none"></div>
<!-- Brand / Security Badge Header -->
<div class="flex flex-col items-center text-center mt-4 mb-10 relative z-10">
<div class="relative flex items-center justify-center w-20 h-20 rounded-xl bg-surface-container-high shadow-xl shadow-surface-container-lowest/80 mb-5 group">
<!-- Outer soft pulse ring -->
<div class="absolute inset-0 rounded-xl bg-gradient-to-b from-primary/20 via-transparent to-transparent opacity-80"></div>
<!-- Vault Icon Indicator -->
<div class="relative w-14 h-14 rounded-lg bg-surface-container flex items-center justify-center text-primary shadow-inner">
<span class="material-symbols-outlined text-3xl transition-transform duration-500 group-hover:scale-105" style="font-variation-settings: &quot;FILL&quot; 1;">lock</span>
<!-- Tiny status dot -->
<span class="absolute top-2 right-2 flex h-2 w-2">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary-fixed opacity-75"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-primary"></span>
</span>
</div>
</div>
<h1 class="font-headline text-3xl font-semibold tracking-tight text-on-surface mb-2">Prism</h1>

</div>
<!-- Focused Login Form -->
<form class="flex flex-col w-full space-y-5 relative z-10" id="vault-login-form" onsubmit="event.preventDefault(); triggerAuth();">
<!-- User ID Field -->
<div class="flex flex-col space-y-2">
<label class="font-label text-xs font-medium tracking-wider uppercase text-on-surface-variant px-1 flex items-center justify-between" for="user-id">
<span>User ID</span>

</label>
<div class="relative flex items-center rounded-xl bg-surface-container-high transition-all duration-200 focus-within:bg-surface-container-highest shadow-md">
<div class="pl-4 pr-2 text-outline flex items-center pointer-events-none">
<span class="material-symbols-outlined text-xl">badge</span>
</div>
<input autocomplete="username" class="w-full py-4 pr-4 bg-transparent font-body text-sm text-on-surface placeholder:text-outline focus:outline-none" id="user-id" placeholder="@username or ID #" required="" type="text">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col space-y-2">
<div class="flex items-center justify-between px-1">
<label class="font-label text-xs font-medium tracking-wider uppercase text-on-surface-variant" for="password">
          Password
        </label>
<button class="font-label text-xs text-primary-fixed-dim hover:text-primary transition-colors" type="button">
          Forgot Password?
        </button>
</div>
<div class="relative flex items-center rounded-xl bg-surface-container-high transition-all duration-200 focus-within:bg-surface-container-highest shadow-md">
<div class="pl-4 pr-2 text-outline flex items-center pointer-events-none">
<span class="material-symbols-outlined text-xl">key</span>
</div>
<input autocomplete="current-password" class="w-full py-4 pr-12 bg-transparent font-body text-sm text-on-surface placeholder:text-outline tracking-widest focus:outline-none" id="password" placeholder="••••••••••••" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute right-3 p-2 rounded-lg text-outline hover:text-on-surface active:scale-95 transition-colors focus:outline-none" id="toggle-password" type="button">
<span class="material-symbols-outlined text-xl" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Primary Unlock Action -->
<div class="pt-4 flex flex-col space-y-4">
<button class="w-full py-4 px-6 rounded-xl text-on-primary font-headline font-semibold text-base tracking-wide shadow-lg shadow-surface-container-lowest flex items-center justify-center space-x-2 transition-all duration-200 active:scale-[0.98] hover:bg-primary-fixed bg-primary-fixed text-on-primary-fixed" id="submit-button" type="submit" disabled="">
<span id="button-label">Access Granted</span>
<span class="material-symbols-outlined text-xl" id="button-icon">check_circle</span>
</button>
<!-- Biometric Quick Access Option -->

</div>
</form>
<!-- Security Footer Badge -->
<div class="mt-12 flex flex-col items-center justify-center text-center relative z-10">

</div>
</div>
<script>
  (function () {
    const passwordInput = document.getElementById('password');
    const toggleButton = document.getElementById('toggle-password');
    const eyeIcon = document.getElementById('eye-icon');
    const submitBtn = document.getElementById('submit-button');
    const buttonLabel = document.getElementById('button-label');
    const buttonIcon = document.getElementById('button-icon');
    const biometricBtn = document.getElementById('biometric-btn');

    if (toggleButton && passwordInput && eyeIcon) {
      toggleButton.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
        passwordInput.classList.toggle('tracking-widest', !isPassword);
      });
    }

    window.triggerAuth = function () {
      if (!submitBtn) return;
      buttonLabel.textContent = 'Decrypting...';
      buttonIcon.textContent = 'sync';
      buttonIcon.classList.add('animate-spin');
      submitBtn.disabled = true;

      setTimeout(() => {
        buttonLabel.textContent = 'Access Granted';
        buttonIcon.classList.remove('animate-spin');
        buttonIcon.textContent = 'check_circle';
        submitBtn.classList.remove('bg-primary');
        submitBtn.classList.add('bg-primary-fixed', 'text-on-primary-fixed');
      }, 1000);
    };

    if (biometricBtn) {
      biometricBtn.addEventListener('click', () => {
        const originalText = biometricBtn.innerHTML;
        biometricBtn.innerHTML = `
          <span class="material-symbols-outlined text-xl text-primary animate-pulse">fingerprint</span>
          <span class="font-label text-sm font-medium">Scanning Touch ID / Face ID...</span>
        `;
        setTimeout(() => {
          triggerAuth();
        }, 800);
      });
    }
  })();
</script></main>

</body></html>
