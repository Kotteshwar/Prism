<script>
  (function initMultiSelect() {
    const cards = document.querySelectorAll('.photo-card');
    const counterEl = document.getElementById('selected-counter');
    const selectAllBtn = document.getElementById('select-all-btn');
    const exitBtn = document.getElementById('exit-btn');

    function updateCounter() {
      const selectedCount = document.querySelectorAll('.photo-card[data-selected="true"]').length;
      if (counterEl) {
        counterEl.textContent = `${selectedCount} Selected`;
      }
    }

    function toggleCard(card) {
      const isSelected = card.getAttribute('data-selected') === 'true';
      const newState = !isSelected;
      card.setAttribute('data-selected', newState ? 'true' : 'false');

      const overlay = card.querySelector('.selection-overlay');
      const badge = card.querySelector('div.absolute.top-2.right-2');

      if (newState) {
        if (overlay) overlay.className = 'selection-overlay absolute inset-0 bg-primary/20 backdrop-brightness-90 transition-opacity';
        if (badge) {
          badge.className = 'absolute top-2 right-2 w-6 h-6 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-lg transform transition-transform duration-200';
          badge.innerHTML = '<span class="material-symbols-outlined text-[16px] font-bold">check</span>';
        }
      } else {
        if (overlay) overlay.className = 'selection-overlay absolute inset-0 bg-surface-dim/0 transition-opacity';
        if (badge) {
          badge.className = 'checkbox-indicator absolute top-2 right-2 w-6 h-6 rounded-full bg-surface-container-lowest/60 backdrop-blur-md flex items-center justify-center shadow transition-all group-hover:bg-surface-container-lowest/90';
          badge.innerHTML = '<span class="w-2 h-2 rounded-full bg-on-surface/40"></span>';
        }
      }

      updateCounter();
    }

    cards.forEach(card => {
      card.addEventListener('click', () => toggleCard(card));
    });

    if (selectAllBtn) {
      selectAllBtn.addEventListener('click', () => {
        const allSelected = Array.from(cards).every(card => card.getAttribute('data-selected') === 'true');
        cards.forEach(card => {
          if (allSelected) {
            // Unselect all
            card.setAttribute('data-selected', 'true');
            toggleCard(card);
          } else {
            // Select all
            card.setAttribute('data-selected', 'false');
            toggleCard(card);
          }
        });
      });
    }

    if (exitBtn) {
      exitBtn.addEventListener('click', () => {
        cards.forEach(card => {
          card.setAttribute('data-selected', 'true');
          toggleCard(card);
        });
      });
    }
  })();
</script></main><div class="fixed bottom-0 inset-x-0 z-50 pb-safe pointer-events-none flex justify-center px-4"><nav class="pointer-events-auto flex items-center gap-2 backdrop-blur-xl bg-surface-container-lowest/80 rounded-full px-5 py-2 shadow-[0_8px_32px_rgba(0,0,0,0.6)]" data-active-classes="text-primary font-bold [&amp;&gt;span]:[font-variation-settings:'FILL'_1]"><a aria-current="page" class="flex flex-col items-center justify-center min-w-[56px] min-h-[44px] transition-all text-primary font-bold [&amp;&gt;span]:[font-variation-settings:'FILL'_1]" data-path="photos" href="#"><span class="material-symbols-outlined text-[24px]">photo_library</span><span class="text-[11px] font-label font-medium tracking-wide mt-0.5">Photos</span></a><a class="flex flex-col items-center justify-center min-w-[56px] min-h-[44px] text-on-surface-variant transition-all hover:text-on-surface" data-path="collections" href="#"><span class="material-symbols-outlined text-[24px]">folder_copy</span><span class="text-[11px] font-label font-medium tracking-wide mt-0.5">Collections</span></a><a class="flex flex-col items-center justify-center min-w-[56px] min-h-[44px] text-on-surface-variant transition-all hover:text-on-surface" data-path="videos" href="#"><span class="material-symbols-outlined text-[24px]">movie</span><span class="text-[11px] font-label font-medium tracking-wide mt-0.5">Videos</span></a></nav></div></body></html>
