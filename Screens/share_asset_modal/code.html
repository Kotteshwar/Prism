<script>
  let activeFormat = 'raw';

  function setExportFormat(format) {
    activeFormat = format;
    const rawBtn = document.getElementById('rawBtn');
    const heicBtn = document.getElementById('heicBtn');
    const badge = document.getElementById('formatBadge');
    const label = document.getElementById('shareBtnLabel');

    if (format === 'raw') {
      rawBtn.className = "py-1.5 px-3 rounded-md text-xs font-label font-medium text-on-surface bg-surface-container-high transition-all text-center";
      heicBtn.className = "py-1.5 px-3 rounded-md text-xs font-label font-medium text-outline hover:text-on-surface transition-all text-center";
      badge.textContent = "Lossless";
      badge.className = "text-[10px] font-label px-2 py-0.5 rounded bg-surface-container-high text-tertiary font-semibold uppercase";
      label.textContent = "Share Master Asset (78.4 MB)";
    } else {
      heicBtn.className = "py-1.5 px-3 rounded-md text-xs font-label font-medium text-on-surface bg-surface-container-high transition-all text-center";
      rawBtn.className = "py-1.5 px-3 rounded-md text-xs font-label font-medium text-outline hover:text-on-surface transition-all text-center";
      badge.textContent = "8.2 MB Optimized";
      badge.className = "text-[10px] font-label px-2 py-0.5 rounded bg-surface-container-high text-secondary font-semibold uppercase";
      label.textContent = "Share Optimized JPEG (8.2 MB)";
    }
  }

  function copyLinkFeedback() {
    const pill = document.getElementById('copyPill');
    const prevText = pill.textContent;
    pill.textContent = 'Copied!';
    pill.classList.remove('bg-surface-container-highest', 'text-on-surface-variant');
    pill.classList.add('bg-tertiary-container', 'text-on-tertiary-container');
    setTimeout(() => {
      pill.textContent = prevText;
      pill.classList.remove('bg-tertiary-container', 'text-on-tertiary-container');
      pill.classList.add('bg-surface-container-highest', 'text-on-surface-variant');
    }, 2000);
  }

  function copyImageFeedback() {
    const pill = document.getElementById('imgCopyPill');
    const prevText = pill.textContent;
    pill.textContent = 'Rendered!';
    pill.classList.remove('bg-surface-container-highest', 'text-on-surface-variant');
    pill.classList.add('bg-tertiary-container', 'text-on-tertiary-container');
    setTimeout(() => {
      pill.textContent = prevText;
      pill.classList.remove('bg-tertiary-container', 'text-on-tertiary-container');
      pill.classList.add('bg-surface-container-highest', 'text-on-surface-variant');
    }, 2000);
  }

  function handleMainShare() {
    const btn = document.getElementById('mainShareBtn');
    const originalContent = btn.innerHTML;
    btn.innerHTML = `<span class="material-symbols-outlined text-[20px] animate-spin">progress_activity</span><span>Preparing file...</span>`;
    setTimeout(() => {
      btn.innerHTML = `<span class="material-symbols-outlined text-[20px]">check</span><span>Ready to send!</span>`;
      setTimeout(() => {
        btn.innerHTML = originalContent;
      }, 1800);
    }, 1000);
  }
