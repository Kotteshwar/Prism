: ; --tw-contain-layout: ; --tw-contain-paint: ; --tw-contain-style: ; --tw-text-opacity: 1; color: rgb(228, 226, 226); letter-spacing: normal; user-select: text !important; outline: none !important; box-shadow: none !important;">Configure New Album</h3></h2><button aria-label="Dismiss dialog" class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[20px]">close</span></button></div><main class="flex flex-col relative w-full px-5 pb-safe overflow-y-auto bg-transparent"><div class="flex flex-col w-full pb-6 space-y-4">

<input class="w-full pl-10 pr-9 py-3 bg-transparent text-sm font-body text-on-surface placeholder:text-outline focus:outline-none" id="albumNameInput" placeholder="e.g., Summer in Big Sur, Architecture 2024" type="text" value="Summer in Big Sur">
<button class="absolute right-2.5 p-1 rounded-full text-outline hover:text-on-surface transition-colors" id="clearNameBtn" title="Clear input" type="button">

<div class="flex flex-col space-y-1.5">
<label class="text-[11px] font-label font-semibold tracking-wider text-on-surface-variant uppercase flex items-center justify-between">
<span>Destination Path</span>
<span class="text-[10px] text-tertiary font-medium flex items-center gap-1">

        </span>

<div class="flex items-center px-3 py-2.5 rounded-lg bg-surface-container-lowest text-xs font-mono text-on-surface-variant overflow-x-auto whitespace-nowrap shadow-inner">

</div>
<!-- Path Sync Checkbox Control -->
<label class="flex items-center gap-2.5 pt-1 cursor-pointer select-none group">
<div class="relative flex items-center justify-center">
<input checked="" class="peer sr-only" id="syncNameCheckbox" type="checkbox">
<div class="w-4 h-4 rounded bg-surface-container-highest peer-checked:bg-primary transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-[14px] text-on-primary hidden peer-checked:block font-bold">check</span>
</div>
</div>

          Use the same name as album name

<div class="flex flex-col space-y-2">

<span class="text-[11px] font-label text-secondary flex items-center gap-1">
<span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>

</div>
<!-- Storage Volume Cards -->
<div class="relative w-full"><button type="button" class="w-full flex items-center justify-between p-3 rounded-xl bg-surface-container-high hover:bg-surface-container-highest transition-colors active:scale-[0.99] border border-outline-variant/60 shadow-sm"><div class="flex items-center gap-2.5 min-w-0"><div class="w-8 h-8 rounded-lg bg-primary text-on-primary flex items-center justify-center shrink-0 shadow"><span class="material-symbols-outlined text-[18px]" style="font-variation-settings: &quot;FILL&quot; 1;">speed</span></div><div class="flex items-center gap-2 min-w-0 truncate"><span class="text-xs font-headline font-semibold text-on-surface truncate">Storage 1 (Primary NVMe Vault)</span><span class="text-[11px] font-body text-on-surface-variant shrink-0">• 1.2 TB free</span><span class="px-1.5 py-0.2 rounded text-[9px] font-label uppercase font-bold bg-surface-container-lowest text-tertiary shrink-0">Fast</span></div></div><div class="flex items-center text-on-surface-variant ml-2 shrink-0"><span class="material-symbols-outlined text-[20px]">keyboard_arrow_down</span></div></button></div>
</div>

            <span class="material-symbols-outlined text-[20px]">check_circle</span>

          </button>

      Metadata indexing will begin immediately in background
    </p>
</div>
</div>
<!-- Client-side Interactive Behaviors -->
<script>
  (function initAlbumForm() {
    const albumInput = document.getElementById('albumNameInput');
    const pathSpan = document.getElementById('dynamicPathSpan');
    const syncCheckbox = document.getElementById('syncNameCheckbox');
    const clearBtn = document.getElementById('clearNameBtn');
    const storageCards = document.querySelectorAll('.storage-card');

    // Sync input with path preview
    function updatePath() {
      if (!syncCheckbox || !pathSpan || !albumInput) return;
      if (syncCheckbox.checked) {
        const val = albumInput.value.trim();
        pathSpan.textContent = (val ? val : 'Untitled Album') + '/';
      }
    }

    if (albumInput) {
      albumInput.addEventListener('input', updatePath);
    }

    if (syncCheckbox) {
      syncCheckbox.addEventListener('change', () => {
        if (!syncCheckbox.checked) {
          pathSpan.classList.add('opacity-60');
        } else {
          pathSpan.classList.remove('opacity-60');
          updatePath();
        }
      });
    }

    if (clearBtn && albumInput) {
      clearBtn.addEventListener('click', () => {
        albumInput.value = '';
        albumInput.focus();
        updatePath();
      });
    }

    // Storage card selection toggle
    storageCards.forEach(card => {
      card.addEventListener('click', () => {
        storageCards.forEach(c => {
          c.classList.remove('bg-surface-container-high', 'shadow-sm');
          c.classList.add('bg-surface-container');
          
          const iconWrapper = c.querySelector('div:first-child > div:first-child');
          if (iconWrapper) {
            iconWrapper.className = 'w-10 h-10 rounded-lg bg-surface-container-highest text-on-surface flex items-center justify-center shrink-0';
          }
          
          const radio = c.querySelector('.volume-radio-indicator');
          if (radio) {
            radio.className = 'volume-radio-indicator w-5 h-5 rounded-full bg-surface-container-highest flex items-center justify-center shrink-0 ml-3';
            const checkIcon = radio.querySelector('.material-symbols-outlined');
            if (checkIcon) checkIcon.classList.add('hidden');
          }
        });

        // Activate clicked card
        card.classList.remove('bg-surface-container');
        card.classList.add('bg-surface-container-high', 'shadow-sm');
        
        const activeIcon = card.querySelector('div:first-child > div:first-child');
        if (activeIcon) {
          activeIcon.className = 'w-10 h-10 rounded-lg bg-primary text-on-primary flex items-center justify-center shrink-0 shadow';
        }

        const activeRadio = card.querySelector('.volume-radio-indicator');
        if (activeRadio) {
          activeRadio.className = 'volume-radio-indicator w-5 h-5 rounded-full bg-primary text-on-primary flex items-center justify-center shrink-0 ml-3';
          const checkIcon = activeRadio.querySelector('.material-symbols-outlined');
          if (checkIcon) checkIcon.classList.remove('hidden');
        }
      });
    });

    // Create Album button microinteraction feedback
    const createBtn = document.getElementById('mainCreateBtn');
    const topCreateBtn = document.getElementById('topCreateBtn');

    function triggerCreateAction() {
      const name = albumInput.value.trim() || 'New Album';
      if (createBtn) {
        createBtn.innerHTML = `
          <span class="material-symbols-outlined text-[18px] animate-spin">progress_activity</span>
          <span>Creating "${name}"...</span>
        `;
        createBtn.classList.add('pointer-events-none', 'opacity-90');
      }
      setTimeout(() => {
        if (createBtn) {
          createBtn.innerHTML = `
            <span class="material-symbols-outlined text-[20px]">check_circle</span>
            <span>Album Created!</span>
          `;
          createBtn.classList.remove('bg-primary', 'text-on-primary');
          createBtn.classList.add('bg-emerald-500', 'text-black');
        }
      }, 900);
    }

    if (createBtn) createBtn.addEventListener('click', triggerCreateAction);
    if (topCreateBtn) topCreateBtn.addEventListener('click', triggerCreateAction);
  })();
</script></main></section></div>
